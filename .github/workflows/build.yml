name: Build Promax APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.promax.hesabdar
          
          # تنظیم دسترسی‌های مانیفست
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/' android/app/build.gradle.kts || true

          # بازنویسی مستقیم و استاندارد MainActivity.kt برای حل خطای FragmentActivity
          KT_DIR="android/app/src/main/kotlin/com/promax/hesabdar/hesabdar_promax"
          mkdir -p "$KT_DIR"
          cat << 'EOF' > "$KT_DIR/MainActivity.kt"
          package com.promax.hesabdar.hesabdar_promax

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity()
          EOF

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdar-Promax-APK
          path: build/app/outputs/flutter-apk/app-release.apk
